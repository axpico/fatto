services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: recipebook
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: recipebook
    volumes:
      - pgdata:/var/lib/postgresql/data
    # localhost only: reachable for local dev / backups on the host, not from the network
    ports:
      - "127.0.0.1:${DB_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U recipebook"]
      interval: 5s
      timeout: 5s
      retries: 10

  # The app runs as non-root `node` (uid 1000); a volume created by an older root image (or by
  # Docker itself) is root-owned and uploads fail with EACCES. Fixed on every start, so upgrades
  # need no manual step.
  uploads-init:
    image: alpine:3.20
    user: root
    command: chown -R 1000:1000 /data/uploads
    volumes:
      - uploads:/data/uploads

  app:
    image: ghcr.io/axpico/fatto:latest
    build: .
    # also covers losing the startup race with Postgres: a failed migrate just retries
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      uploads-init:
        condition: service_completed_successfully
    environment:
      DATABASE_URL: postgresql://recipebook:${POSTGRES_PASSWORD}@db:5432/recipebook
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY}
      ANTHROPIC_MODEL: ${ANTHROPIC_MODEL:-claude-haiku-4-5}
      GROQ_API_KEY: ${GROQ_API_KEY}
      GROQ_MODEL: ${GROQ_MODEL:-openai/gpt-oss-20b}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY}
      OPENROUTER_MODEL_OVERRIDE: ${OPENROUTER_MODEL_OVERRIDE}
      UPLOAD_DIR: /data/uploads
      ADMIN_EMAIL: ${ADMIN_EMAIL}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD}
      ADMIN_NAME: ${ADMIN_NAME:-Admin}
      COOKIE_SECURE: ${COOKIE_SECURE:-true}
      NODE_ENV: production
    volumes:
      - uploads:/data/uploads
    ports:
      - "3000:3000"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3000/api/health"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
  uploads:
