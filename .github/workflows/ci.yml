name: CI

on:
  push:
  pull_request:

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx prisma generate
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
        env:
          # Placeholders so env validation passes during build's page-data collection step (same
          # approach as the Dockerfile); nothing actually connects to these during `next build`.
          DATABASE_URL: postgresql://placeholder:placeholder@localhost:5432/placeholder
          ANTHROPIC_API_KEY: build-placeholder
